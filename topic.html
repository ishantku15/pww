<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>As Multiverse — Topic</title>
  <link rel="icon" href="https://nexttoppers.asmultiverse.in/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="global-auth.js"></script>
  <style>
    /* Specific Topic Page Styles to match PW premium UI */
    .topic-header {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-primary);
    }
    
    .topic-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-primary);
      position: sticky;
      top: 68px; /* below main header */
      z-index: 30;
      overflow-x: auto;
    }
    .topic-tab {
      flex: 1;
      min-width: 120px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .topic-tab:hover {
      color: var(--text-secondary);
    }
    .topic-tab.active {
      color: #a78bfa;
      border-bottom-color: #a78bfa;
    }

    .grid-content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 24px;
    }
    @media (min-width: 768px) {
      .grid-content {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Card Design */
    .content-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color 0.2s, background 0.2s;
    }
    .content-card:hover {
      background: rgba(255,255,255,0.03);
      border-color: var(--border-strong);
    }

    .card-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .card-icon-svg {
      color: #60a5fa; /* light blue for DPP */
    }

    .card-info {
      flex: 1;
      min-width: 0;
    }
    
    .card-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-duration {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    .card-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    .btn-action {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    
    .btn-play {
      background: #8b5cf6;
      color: white;
    }
    .btn-play:hover {
      background: #7c3aed;
    }

    .btn-secondary-action {
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
    }
    .btn-secondary-action:hover {
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .btn-icon-only {
      width: 40px;
      height: 40px;
      flex: none;
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-icon-only:hover {
      background: rgba(255,255,255,0.12);
      color: white;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header" style="position: sticky; top: 0;">
      <div class="loading-bar hidden" id="loading-bar"><div class="loading-bar-inner"></div></div>
      <div class="header-inner">
        <button class="header-back" onclick="window.history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h1 class="header-title" id="topic-name">Loading...</h1>
      </div>
    </header>

    <div class="topic-tabs">
      <div class="topic-tab active" data-tab="videos">Lectures</div>
      <div class="topic-tab" data-tab="notes">Notes</div>
      <div class="topic-tab" data-tab="exercises">DPP</div>
      <div class="topic-tab" data-tab="dpp-videos">DPP Videos</div>
    </div>

    <main>
      <div class="grid-content" id="content-container">
        <!-- Skeleton Loaders -->
        <div class="content-card"><div class="card-top"><div class="card-icon skeleton"></div><div class="card-info"><div class="skeleton-line skeleton-line-sm mb-2"></div><div class="skeleton-line skeleton-line-lg mb-1"></div><div class="skeleton-line skeleton-line-lg w-3/4"></div></div></div><div class="card-actions"><div class="skeleton-btn flex-1"></div><div class="skeleton-btn flex-1"></div></div></div>
        <div class="content-card"><div class="card-top"><div class="card-icon skeleton"></div><div class="card-info"><div class="skeleton-line skeleton-line-sm mb-2"></div><div class="skeleton-line skeleton-line-lg mb-1"></div><div class="skeleton-line skeleton-line-lg w-3/4"></div></div></div><div class="card-actions"><div class="skeleton-btn flex-1"></div><div class="skeleton-btn flex-1"></div></div></div>
      </div>
    </main>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const batchId = urlParams.get('batchId');
    const subjectSlug = urlParams.get('subjectSlug');
    const topicSlug = urlParams.get('topicSlug');
    const topicName = urlParams.get('topicName') || 'Topic Contents';
    const subjectId = urlParams.get('subjectId');
    
    document.getElementById('topic-name').textContent = topicName;
    document.title = `As Multiverse — ${topicName}`;

    const WORKER = 'https://pw.2snfjitu.workers.dev';
    
    let currentTab = 'videos';

    const tabs = document.querySelectorAll('.topic-tab');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.getAttribute('data-tab');
        fetchContent();
      });
    });

    function formatDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      } catch(e) {
        return dateStr;
      }
    }

    async function fetchContent() {
      const container = document.getElementById('content-container');
      const loadingBar = document.getElementById('loading-bar');
      
      container.innerHTML = `
        <div class="content-card"><div class="card-top"><div class="card-icon skeleton"></div><div class="card-info"><div class="skeleton-line skeleton-line-sm mb-2"></div><div class="skeleton-line skeleton-line-lg mb-1"></div><div class="skeleton-line skeleton-line-lg w-3/4"></div></div></div><div class="card-actions"><div class="skeleton-btn flex-1"></div><div class="skeleton-btn flex-1"></div></div></div>
        <div class="content-card"><div class="card-top"><div class="card-icon skeleton"></div><div class="card-info"><div class="skeleton-line skeleton-line-sm mb-2"></div><div class="skeleton-line skeleton-line-lg mb-1"></div><div class="skeleton-line skeleton-line-lg w-3/4"></div></div></div><div class="card-actions"><div class="skeleton-btn flex-1"></div><div class="skeleton-btn flex-1"></div></div></div>
      `;
      loadingBar.classList.remove('hidden');

      try {
        const res = await fetch(`${WORKER}/api/pw/datacontent?batchId=${batchId}&subjectSlug=${subjectSlug}&topicSlug=${topicSlug}&contentType=${currentTab}`);
        const data = await res.json();
        
        container.innerHTML = '';
        
        if (!data.success || !Array.isArray(data.data) || data.data.length === 0) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1; padding: 60px 20px;">
              <div class="empty-state-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              </div>
              <h2 class="empty-state-title">No ${currentTab.replace('-', ' ')} found</h2>
            </div>
          `;
          return;
        }

        data.data.forEach(item => {
          let cardHtml = '';
          const title = item.topic || item.name || (item.homeworkIds && item.homeworkIds[0] && item.homeworkIds[0].topic) || 'Untitled';
          const date = item.date || item.createdAt;
          const formattedDate = date ? formatDate(date) : 'Recent';

          if (currentTab === 'videos' || currentTab === 'dpp-videos') {
            const vidId = (item.videoDetails && item.videoDetails.findKey) ? item.videoDetails.findKey : item._id;
            const duration = (item.videoDetails && item.videoDetails.duration) ? item.videoDetails.duration : (item.duration || '00:00:00');
            let imgUrl = 'https://i.ibb.co/9Hm0NqsH/f69ed82b-7169-45fc-a82b-915e453c6340.png'; // placeholder
            if (item.videoDetails && item.videoDetails.image) imgUrl = item.videoDetails.image;
            else if (item.previewImage) imgUrl = item.previewImage;

            const tag = currentTab === 'videos' ? 'LECTURE' : 'DPP VIDEO';

            cardHtml = `
              <div class="content-card animate-fadeSlideUp">
                <div class="card-top">
                  <div class="card-icon">
                    <img src="${imgUrl}" onerror="this.src='https://i.ibb.co/9k8fbHmZ/empty-state.png'" alt="Thumbnail">
                  </div>
                  <div class="card-info">
                    <div class="card-meta">${tag} &bull; ${formattedDate}</div>
                    <div class="card-title" title="${title}">${title}</div>
                    <div class="card-duration">${duration}</div>
                  </div>
                </div>
                <div class="card-actions">
                  <button class="btn-action btn-play" onclick="window.location.href='player.html?video_id=${vidId}&subject_slug=${subjectSlug}&batch_id=${batchId}&schedule_id=${item._id}&subject_id=${subjectId}&topicSlug=${topicSlug}'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"></path></svg> Watch
                  </button>
                  <button class="btn-action btn-secondary-action" onclick="alert('Notes portal coming soon')">
                    Notes & more
                  </button>
                </div>
              </div>
            `;
          } 
          else if (currentTab === 'exercises' || currentTab === 'notes') {
            const tag = currentTab === 'exercises' ? 'DPP' : 'NOTE';

            cardHtml = `
              <div class="content-card animate-fadeSlideUp">
                <div class="card-top">
                  <div class="card-icon">
                    <svg class="card-icon-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                  </div>
                  <div class="card-info">
                    <div class="card-meta">${tag} &bull; ${formattedDate}</div>
                    <div class="card-title" title="${title}">${title}</div>
                  </div>
                </div>
                <div class="card-actions">
                  <button class="btn-action btn-secondary-action" onclick="openPdf('${item._id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg> View Note
                  </button>
                  <button class="btn-icon-only" onclick="openPdf('${item._id}')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  </button>
                </div>
              </div>
            `;
          }
          
          container.insertAdjacentHTML('beforeend', cardHtml);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon" style="color: #ef4444; border-color: rgba(239,68,68,0.2); background: rgba(239,68,68,0.1);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h2 class="empty-state-title text-red-400">Failed to load content</h2>
          </div>
        `;
      } finally {
        loadingBar.classList.add('hidden');
      }
    }

    window.openPdf = async function(contentId) {
      try {
        const res = await fetch(`${WORKER}/api/pw/attachments-url?BatchId=${batchId}&SubjectId=${subjectId}&ContentId=${contentId}`);
        const data = await res.json();
        if (data.success && data.data && data.data.length > 0) {
          const att = data.data[0];
          const actualUrl = att.url || (att.baseUrl + att.key);
          const viewUrl = `${WORKER}/api/pw/view?url=${encodeURIComponent(actualUrl)}&filename=${encodeURIComponent(att.topic || 'Document')}`;
          window.open(viewUrl, '_blank');
        } else {
          alert('PDF not available for this item.');
        }
      } catch (err) {
        console.error(err);
        alert('Failed to fetch PDF');
      }
    };

    if (!batchId || !subjectSlug || !topicSlug) {
      window.location.href = 'index.html';
    } else {
      fetchContent();
    }
  </script>
</body>
</html>
