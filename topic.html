<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>As Multiverse — Topic</title>
  <link rel="icon" href="https://nexttoppers.asmultiverse.in/logo.png">
  <link rel="stylesheet" href="styles.css">
  <script src="global-auth.js"></script>
</head>
<body>
  <div class="page-wrapper">
    <header class="site-header">
      <div class="loading-bar hidden" id="loading-bar"><div class="loading-bar-inner"></div></div>
      <div class="header-inner">
        <button class="header-back" onclick="window.history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h1 class="header-title" id="topic-name">Loading...</h1>
      </div>
    </header>

    <main class="container-narrow pt-6">
      <div class="tabs" id="tabs-container">
        <button class="tab-btn active" data-tab="videos">Videos</button>
        <button class="tab-btn" data-tab="exercises">Exercises</button>
        <button class="tab-btn" data-tab="notes">Notes</button>
      </div>

      <div id="content-container">
        <!-- Content injected here -->
      </div>
    </main>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const batchId = urlParams.get('batchId');
    const subjectSlug = urlParams.get('subjectSlug');
    const topicSlug = urlParams.get('topicSlug');
    const topicName = urlParams.get('topicName') || 'Topic Contents';
    const subjectId = urlParams.get('subjectId');
    
    document.getElementById('topic-name').textContent = topicName;
    document.title = `As Multiverse — ${topicName}`;

    const WORKER = 'https://pw.2snfjitu.workers.dev';
    
    let currentTab = 'videos';

    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.getAttribute('data-tab');
        fetchContent();
      });
    });

    async function fetchContent() {
      const container = document.getElementById('content-container');
      const loadingBar = document.getElementById('loading-bar');
      
      container.innerHTML = `
        <div class="flex flex-col gap-3">
          <div class="skeleton skeleton-list-item"></div>
          <div class="skeleton skeleton-list-item"></div>
          <div class="skeleton skeleton-list-item"></div>
        </div>
      `;
      loadingBar.classList.remove('hidden');

      try {
        const res = await fetch(`${WORKER}/api/pw/datacontent?batchId=${batchId}&subjectSlug=${subjectSlug}&topicSlug=${topicSlug}&contentType=${currentTab}`);
        const data = await res.json();
        
        container.innerHTML = '';
        
        if (!data.success || !Array.isArray(data.data) || data.data.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              </div>
              <h2 class="empty-state-title">No ${currentTab} found</h2>
            </div>
          `;
          return;
        }

        const listDiv = document.createElement('div');
        listDiv.className = 'flex flex-col gap-3 stagger';
        
        data.data.forEach(item => {
          if (currentTab === 'videos') {
            const vidId = (item.videoDetails && item.videoDetails.findKey) ? item.videoDetails.findKey : item._id;
            const duration = (item.videoDetails && item.videoDetails.duration) ? item.videoDetails.duration : (item.duration || '');
            let imgUrl = 'https://i.ibb.co/9Hm0NqsH/f69ed82b-7169-45fc-a82b-915e453c6340.png';
            if (item.videoDetails && item.videoDetails.image) imgUrl = item.videoDetails.image;
            else if (item.previewImage) imgUrl = item.previewImage;

            listDiv.innerHTML += `
              <div class="list-item" style="padding: 12px; cursor: pointer;" onclick="window.location.href='player.html?video_id=${vidId}&subject_slug=${subjectSlug}&batch_id=${batchId}&schedule_id=${item._id}&subject_id=${subjectId}&topicSlug=${topicSlug}'">
                <div class="relative w-32 aspect-video bg-black rounded-lg overflow-hidden flex-shrink-0 border border-white/10">
                  <img src="${imgUrl}" class="w-full h-full object-cover opacity-80" loading="lazy" onerror="this.src='https://i.ibb.co/9k8fbHmZ/empty-state.png'">
                  <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-8 h-8 bg-black/60 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20 text-white">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M5 3l14 9-14 9V3z"></path></svg>
                    </div>
                  </div>
                  ${duration ? `<div class="absolute bottom-1 right-1 bg-black/80 px-1.5 py-0.5 rounded text-[10px] font-mono font-bold">${duration}</div>` : ''}
                </div>
                <div class="list-item-content pl-2">
                  <div class="list-item-title text-sm" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;">${item.topic || item.name || 'Video'}</div>
                </div>
              </div>
            `;
          } 
          else if (currentTab === 'exercises') {
            listDiv.innerHTML += `
              <div class="list-item">
                <div class="list-item-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg></div>
                <div class="list-item-content">
                  <div class="list-item-title">${item.topic || item.name || 'Exercise'}</div>
                </div>
                <button class="btn btn-outline" style="padding: 6px 12px; width: auto;" onclick="alert('Exercise portal coming soon')">Attempt</button>
              </div>
            `;
          }
          else if (currentTab === 'notes') {
            const dlUrl = `${WORKER}/api/pw/view?url=${encodeURIComponent(item.url)}&filename=${encodeURIComponent(item.name || item.topic)}`;
            listDiv.innerHTML += `
              <div class="list-item">
                <div class="list-item-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></div>
                <div class="list-item-content">
                  <div class="list-item-title">${item.topic || item.name || 'Note'}</div>
                </div>
                <a href="${dlUrl}" target="_blank" class="btn btn-outline" style="padding: 6px 12px; width: auto; display: flex; gap: 4px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                  View
                </a>
              </div>
            `;
          }
        });
        
        container.appendChild(listDiv);

      } catch (err) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" style="color: #ef4444; border-color: rgba(239,68,68,0.2); background: rgba(239,68,68,0.1);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <h2 class="empty-state-title text-red-400">Failed to load content</h2>
          </div>
        `;
      } finally {
        loadingBar.classList.add('hidden');
      }
    }

    if (!batchId || !subjectSlug || !topicSlug) {
      window.location.href = 'index.html';
    } else {
      fetchContent();
    }
  </script>
</body>
</html>
